plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // JEI (Just Enough Items) - recipe viewer integration
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    // Curios API (baubles)
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    // KubeJS - интеграция (опционально)
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // dev bridge (tools/tcbridge.sh) - port can differ from the server one
            systemProperty 'tcbridge.port', '9887'
        }

        server {
            server()
            programArgument '--nogui'
            // dev bridge on its own port so client and server can run together
            systemProperty 'tcbridge.port', '9888'
            // keep the dedicated server in its own game dir so client-only dev
            // mods (dropped into run/mods) never end up on its classpath
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -PgameTestDir=run-gametest: a game dir whose mods/ holds other mods for the integration tests
            gameDirectory = project.file(findProperty('gameTestDir') ?: 'run')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI (optional at runtime, present in dev for convenience)
    compileOnly "mezz.jei:jei-${jei_version_mc}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_version_mc}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_version_mc}-common:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_version_mc}-neoforge:${jei_version}"

    // Curios обязателен де-факто: амулеты реализуют ICurioItem и регистрируются на старте.
    // В mods.toml тоже объявлен required — см. src/main/templates/META-INF/neoforge.mods.toml
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    // KubeJS-совместимость (опционально)
    compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.379"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
